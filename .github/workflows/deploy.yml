name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      WARMHOLE_SYNC_TOKEN: ${{ secrets.WARMHOLE_SYNC_TOKEN }}
    strategy:
      matrix:
        include:
          - app: nbaglivo
            project: nbaglivo-dev
          - app: engineering
            project: engineering-nbaglivo
          - app: the-open-inner-monologue
            project: the-open-inner-monologue
            warmhole_site: inner-monologue
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - run: npm ci
      - run: npm run build --workspace=apps/${{ matrix.app }}

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/${{ matrix.app }}
          command: pages deploy dist --project-name=${{ matrix.project }}

      - name: Notify warmhole
        if: matrix.warmhole_site && env.WARMHOLE_SYNC_TOKEN
        run: >
          curl --fail --retry 3 -X POST
          -H "Authorization: Bearer $WARMHOLE_SYNC_TOKEN"
          https://ap.nbaglivo.dev/sites/${{ matrix.warmhole_site }}/sync
