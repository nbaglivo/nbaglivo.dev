# lefthook.yml

pre-commit:
  parallel: true
  jobs:
    - name: html-validate
      run: npx html-validate '{staged_files}'
      glob: "*.html"
      stage_fixed: true


pre-push:
  jobs:
    - name: lighthouse
      run: npm run lighthouse
      glob:
        - "apps/**/*.{html,css,md}"
        - "apps/*/public/**"
        - "packages/post-publishing/src/**"
